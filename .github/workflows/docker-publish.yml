name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag'
        required: true
        default: 'latest'
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: fraud_detector
            context: ./fraud_detector
          - service: transaction_simulator
            context: ./transaction_simulator
          - service: scoring_writer
            context: ./scoring_writer
          - service: data_loader
            context: ./data_loader
          - service: airflow
            context: ./airflow
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/mlops_realtime_fraud_detector_monitoring_${{ matrix.service }}:${{ github.event.inputs.tag || 'latest' }}
